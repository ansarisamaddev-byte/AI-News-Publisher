name: Upload YouTube Videos (23:53 IST)

on:
  schedule:
    - cron: "23 18 * * *"

  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: youtube-video-uploader
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r youtube_uploader_requirements.txt

      - name: Restore YouTube OAuth token
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          if [ -z "$YOUTUBE_TOKEN_JSON" ]; then
            echo "Missing GitHub secret: YOUTUBE_TOKEN_JSON"
            exit 1
          fi
          printf '%s' "$YOUTUBE_TOKEN_JSON" > youtube_token.json

      - name: Upload pending videos
        env:
          YOUTUBE_TOKEN_FILE: youtube_token.json
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          YOUTUBE_PRIVACY_STATUS: public
          MAX_UPLOADS_PER_RUN: "1"
        run: python youtube_uploader.py

      - name: Commit updated news metadata
        if: success()
        run: |
          if [[ -n "$(git status --porcelain -- data/content)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/content
            git commit -m "Update YouTube upload status"
            git push
          else
            echo "No content metadata changes to commit."
          fi
