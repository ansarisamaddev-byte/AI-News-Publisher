
name: News Fetcher

on:
  schedule:
    # Daily at 10:00 PM IST
    - cron: "30 16 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-news-fetcher
  cancel-in-progress: false

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # CHECKOUT
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # PYTHON SETUP
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # INSTALL DEPENDENCIES
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r news_fetcher_requirements.txt

      # FETCH NEWS
      - name: Fetch latest news
        run: |
          echo "Starting News Fetcher..."
          python news_fetcher.py

      # COMMIT AND PUSH CSV
      - name: Save CSV and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- data/news/

          if ! git diff --cached --quiet; then
            git commit -m "Update latest news queue"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No news queue changes to commit."
          fi
