
name: Video Generator

on:
  workflow_dispatch:

  schedule:
    # Daily at 12:00 PM and 10:00 PM IST
    - cron: "30 6 * * *"
    - cron: "30 16 * * *"

permissions:
  contents: write

concurrency:
  group: video-generator
  cancel-in-progress: false

jobs:
  generate-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: image_generator_requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r image_generator_requirements.txt

      - name: Generate pending videos
        run: python video_generator.py

      - name: Commit generated videos and content status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- public/ data/content/

          if ! git diff --cached --quiet; then
            git commit -m "chore: generate news videos"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No video changes to commit."
          fi
