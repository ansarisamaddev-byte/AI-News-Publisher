
name: Image Generator

on:
  workflow_run:
    workflows:
      - AI Content Generator
    types:
      - completed
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: image-generator
  cancel-in-progress: false

jobs:
  generate-images:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      ENV: PROD
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER }}
      NEWS_BRAND: ${{ vars.NEWS_BRAND }}
      NEWS_WEBSITE: ${{ vars.NEWS_WEBSITE }}

    steps:
      # --------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # PYTHON SETUP
      # --------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: image_generator_requirements.txt

      # --------------------------------------------------
      # INSTALL DEPENDENCIES
      # --------------------------------------------------

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r image_generator_requirements.txt

      # --------------------------------------------------
      # GENERATE IMAGES
      # --------------------------------------------------

      - name: Generate carousel images
        run: |
          echo "Environment: $ENV"
          python image_generator.py

      # --------------------------------------------------
      # COMMIT GENERATED IMAGES
      # --------------------------------------------------

      - name: Commit generated images, manifest and content status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- public/ data/content/

          if ! git diff --cached --quiet; then
            git commit -m "chore: generate news carousel images"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No changes to commit."
          fi
